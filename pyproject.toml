[project]
name = "scutch"
version = "0.1.0"
description = "A local-first, repository-centred catalogue of typed operations for humans and agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "jsonschema>=4.21,<5",
  "textual>=8,<9",
]

[project.scripts]
scutch = "scutch.cli:_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scutch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
